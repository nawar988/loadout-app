<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loadout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loadout">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#b3352c">

<style>
:root{
  --ground:#f3f1ec;
  --surface:#ffffff;
  --surface-2:#eae7e0;
  --ink:#211f1c;
  --ink-dim:#6b6760;
  --line:#dcd8cf;
  --accent:#b3352c;
  --accent-ink:#ffffff;
  --plate-a:#3d6b8a;
  --plate-b:#c98a2e;
  --plate-c:#5b7a4f;
  --done:#5b7a4f;
  --shadow: 0 1px 2px rgba(33,31,28,0.06), 0 4px 14px rgba(33,31,28,0.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#17161a;
    --surface:#211f24;
    --surface-2:#2a282e;
    --ink:#eeece6;
    --ink-dim:#9a968d;
    --line:#37343b;
    --accent:#e2665a;
    --accent-ink:#1a1214;
    --plate-a:#6ea3c7;
    --plate-b:#e0a85a;
    --plate-c:#8bab7d;
    --done:#8bab7d;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --ground:#17161a;
  --surface:#211f24;
  --surface-2:#2a282e;
  --ink:#eeece6;
  --ink-dim:#9a968d;
  --line:#37343b;
  --accent:#e2665a;
  --accent-ink:#1a1214;
  --plate-a:#6ea3c7;
  --plate-b:#e0a85a;
  --plate-c:#8bab7d;
  --done:#8bab7d;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.app{max-width:560px;margin:0 auto;padding:0 14px;}

h1,h2,h3{font-family:"Oswald", "Arial Narrow", sans-serif; text-transform:uppercase; text-wrap:balance; margin:0;}

header.top{
  position:sticky; top:0; z-index:5;
  background:var(--ground);
  padding:16px 0 10px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; justify-content:space-between; padding:0 14px 12px;}
.brand-name{display:flex; align-items:center; gap:9px;}
.brand-logo{width:30px; height:30px; border-radius:8px; display:block;}
.brand h1{font-size:22px; letter-spacing:0.02em; color:var(--ink);}
.today-pill{
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
  color:var(--accent); background:transparent; border:1px solid var(--accent);
  border-radius:999px; padding:5px 11px; letter-spacing:0.03em; cursor:pointer;
}
.today-pill:active{background:var(--accent); color:var(--accent-ink);}

.tabs{display:flex; gap:6px; overflow-x:auto; padding:0 14px 2px; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  position:relative; flex:0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
  padding:8px 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-dim); white-space:nowrap; cursor:pointer;
  letter-spacing:0.02em;
}
.tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.tab-today-dot{
  position:absolute; top:3px; inset-inline-end:5px; width:5px; height:5px; border-radius:50%;
  background:var(--done);
}
.tab.active .tab-today-dot{background:var(--accent-ink);}

main{padding:16px 0 8px;}
.day-head{padding:2px 0 14px;}
.day-head h2{font-size:26px; color:var(--ink);}
.day-head p{margin:4px 0 0; color:var(--ink-dim); font-size:13.5px;}

.repeat-note{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin-bottom:14px; font-size:13px; color:var(--ink-dim);
}
.repeat-note strong{color:var(--ink); font-weight:600;}

.block{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden;
}
.block-head{
  display:flex; align-items:center; gap:10px; padding:11px 14px;
  border-bottom:1px solid var(--line);
}
.chip{width:9px; height:9px; border-radius:2px; flex:0 0 auto;}
.block-head h3{font-size:14px; letter-spacing:0.03em; color:var(--ink); flex:1;}
.block-type{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em;}

.exercise{padding:13px 14px; border-bottom:1px solid var(--line);}
.exercise:last-child{border-bottom:none;}

.ex-visual{
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:var(--ground); border:1px solid var(--line); border-radius:12px;
  padding:10px 4px 8px; margin-bottom:11px; overflow-x:auto;
}
.viz-item{display:flex; flex-direction:column; align-items:center; gap:3px; flex:0 0 auto;}
.viz-item svg{display:block;}
.pose-photo{
  width:84px; height:84px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); overflow:hidden; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  cursor:zoom-in;
}
.pose-photo img{width:100%; height:100%; object-fit:contain; display:block;}

.lightbox{
  position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;
}
.lightbox img{max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.5);}
.lightbox-caption{
  position:absolute; bottom:28px; left:0; right:0; text-align:center;
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:#fff; opacity:0.85;
}
.viz-label{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; text-transform:uppercase;
  letter-spacing:0.04em; color:var(--ink-dim);
}
.viz-divider{width:1px; align-self:stretch; background:var(--line); margin:2px 2px;}
.viz-arrow{font-size:15px; color:var(--ink-dim); font-weight:600; margin:0 -2px;}

.ex-top{display:flex; align-items:center; gap:10px; cursor:pointer; flex-wrap:wrap;}
.ex-text{flex:1 1 120px; min-width:0;}
.ex-name{font-weight:600; font-size:15px; line-height:1.25;}
.ex-muscle{font-size:12px; color:var(--ink-dim); margin-top:2px;}
.ex-range{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-dim);
  white-space:nowrap; text-align:end; padding-top:2px; flex:0 0 auto; width:100%;
}
.ex-range b{color:var(--ink); font-weight:600;}
@media (min-width:400px){ .ex-range{width:auto; margin-inline-start:auto;} }

.cue{
  font-size:12.5px; color:var(--ink-dim); margin-top:8px; padding-top:8px;
  border-top:1px dashed var(--line); display:none; line-height:1.45;
}
.exercise.open .cue{display:block;}

.sets{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.set-row{display:grid; grid-template-columns:22px 1fr 1fr 22px; gap:8px; align-items:center;}
.set-num{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-dim); text-align:center;}
.set-row input{
  font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:500;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  color:var(--ink); padding:8px 6px; width:100%; text-align:center;
  -moz-appearance:textfield;
}
.set-row input::-webkit-outer-spin-button,.set-row input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.set-row input::placeholder{color:var(--ink-dim); opacity:0.6;}
.set-row input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
.set-check{
  width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line);
  background:var(--surface-2); cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:transparent; font-size:14px; padding:0;
}
.set-check.done{background:var(--done); border-color:var(--done); color:var(--surface);}
.hint{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-dim); margin-top:6px; opacity:0.8;}

.rest{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:32px 20px; text-align:center; box-shadow:var(--shadow);
}
.rest h2{font-size:22px;}
.rest p{color:var(--ink-dim); font-size:14px; margin:10px 0 0; max-width:34ch; margin-inline:auto;}

footer{padding:18px 14px 4px; text-align:center;}
footer p{font-size:11px; color:var(--ink-dim); font-family:"IBM Plex Mono",monospace;}

.home-tab{flex:0 0 auto; font-size:15px; padding:8px 11px;}

.cal-card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px; box-shadow:var(--shadow); margin-bottom:14px;
}
.cal-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cal-nav{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink); font-size:16px; line-height:1; cursor:pointer;
}
.cal-month{font-family:"Oswald",sans-serif; text-transform:uppercase; font-size:16px; letter-spacing:0.03em;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-dow{margin-bottom:4px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-dim); text-align:center;}
.cal-cell{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative;
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink); cursor:pointer;
}
.cal-cell.empty{visibility:hidden; cursor:default;}
.cal-cell.today .cal-num{box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-num{
  display:flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%; font-weight:600;
}
.cal-cell.done .cal-num{background:var(--done); color:var(--surface); font-weight:700;}
.cal-cell.done.today .cal-num{box-shadow:inset 0 0 0 2px var(--accent);}
.cal-cell.selected .cal-num{outline:2px solid var(--accent); outline-offset:2px;}

.cal-footer{
  display:flex; align-items:center; justify-content:space-between; margin-top:12px;
  padding-top:12px; border-top:1px solid var(--line);
}
.week-start-picker{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-dim);
  display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:0.03em;
}
.week-start-picker select{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:3px 5px;
}
.cal-today-btn{
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; color:var(--accent);
  background:transparent; border:1px solid var(--accent); border-radius:8px; padding:5px 10px; cursor:pointer;
}

.date-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
.date-arrow{
  width:32px; height:32px; flex:0 0 auto; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:17px; line-height:1; cursor:pointer;
}
.date-current{
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-dim);
  text-align:center; flex:1;
}
.date-current.is-today{color:var(--accent); font-weight:600;}

.detail-card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px; margin-bottom:14px; box-shadow:var(--shadow);
}
.detail-date{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-dim);
  text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;
}
.detail-empty{font-size:13.5px; color:var(--ink-dim); margin:0 0 12px;}
.detail-log-btn{
  width:100%; margin-top:4px; padding:11px; border-radius:10px; border:1.5px solid var(--accent);
  background:transparent; color:var(--accent); font-family:"IBM Plex Sans",sans-serif;
  font-weight:600; font-size:13.5px; cursor:pointer;
}
.detail-ex{padding:8px 0; border-top:1px solid var(--line);}
.detail-ex:first-of-type{border-top:none;}
.detail-ex-name{font-weight:600; font-size:13.5px; margin-bottom:5px;}
.detail-sets{display:flex; flex-wrap:wrap; gap:5px;}
.detail-chip{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:7px; padding:3px 7px; color:var(--ink);
}

.week-stat{
  background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; margin-bottom:14px; font-size:14px; text-align:center;
}
.week-stat b{font-family:"IBM Plex Mono",monospace; color:var(--accent); font-size:16px;}

.today-card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:16px; text-align:center; box-shadow:var(--shadow);
}
.today-label{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em;}
.today-name{font-family:"Oswald",sans-serif; text-transform:uppercase; font-size:22px; margin:4px 0 14px;}
.start-btn{
  font-family:"IBM Plex Sans",sans-serif; font-weight:600; font-size:14.5px;
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
  padding:12px 22px; cursor:pointer; width:100%;
}

.complete-btn{
  display:block; width:100%; margin-top:6px; padding:14px; border-radius:12px;
  border:1.5px solid var(--accent); background:transparent; color:var(--accent);
  font-family:"IBM Plex Sans",sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;
}
.complete-btn.done{background:var(--done); border-color:var(--done); color:var(--surface);}

@media (prefers-reduced-motion: no-preference){
  .exercise, .block{transition:background 0.15s ease;}
}
</style>
</head>

e": "تجعيد المطرقة بالدمبل من الوقوف", "cue": "امسك الدمبل بقبضة محايدة (الكفان متقابلان) وجعّد للأعلى"}, "Bulgarian Split Squat": {"muscle": "الفخذ الأمامي والورك (أحادي الجانب)", "name": "القرفصاء البلغاري", "cue": "ضع قدمك الخلفية على مقعد خلفك وانزل بعمق على الرجل الأمامية"}, "Cable Woodchop": {"muscle": "البطن (المائلة/دوراني)", "name": "حركة الفأس بالكابل", "cue": "اسحب الكابل قطريًا عبر جذعك بحركة دورانية"}, "Leg Press (Low Foot Placement)": {"muscle": "الفخذ الأمامي والأرداف (عزل)", "name": "ضغط الرجل (وضع القدم منخفض)", "cue": "ضع قدميك منخفضتين على المنصة وأنزل ركبتيك بعمق نحو الكتفين"}, "Lying Leg Curl Machine": {"muscle": "أوتار الركبة (تركيز الرأس الطويل)", "name": "جهاز ثني الرجل من الاستلقاء", "cue": "استلقِ على المقعد واسحب كعبيك للأعلى نحو أسفل ظهرك"}, "Seated Calf Raise Machine": {"muscle": "السمانة (العضلة الداخلية العميقة)", "name": "جهاز رفع السمانة من الجلوس", "cue": "اجلس وادفع للأعلى على أطراف أصابعك والوسادة على فخذيك"}, "Weighted Ab Crunch Machine": {"muscle": "البطن (المستقيمة العلوية)", "name": "جهاز طي البطن بأثقال", "cue": "اطوِ أعلى قفصك الصدري نحو الحوض باستخدام الجهاز"}};
function tx(ex, field){ return (LANG==="ar" && EX_I18N[ex.name]) ? EX_I18N[ex.name][field] : ex[field]; }
function txName(englishName){ return (LANG==="ar" && EX_I18N[englishName]) ? EX_I18N[englishName].name : englishName; }
const DAY_I18N = {"Upper Alpha": "علوي أ", "Lower Alpha": "سفلي أ", "Upper Beta": "علوي ب", "Lower Beta": "سفلي ب", "Upper Rotation": "تكرار علوي", "Lower Rotation": "تكرار سفلي", "Rest": "راحة"};
function tDayName(name){ return LANG==="ar" ? (DAY_I18N[name]||name) : name; }
function localeArg(){ return LANG==="ar" ? "ar-u-nu-latn" : undefined; }
const PLATE_VAR = { a:"--plate-a", b:"--plate-b", c:"--plate-c" };

// --- muscle silhouette: real anatomical front/back body map (70+ traced muscle
// regions) from github.com/vulovix/body-muscles (Apache-2.0). We render every
// path in the relevant view as the base body, then color in just the target
// muscle(s) — so unlike a single dot, the actual muscle shape lights up.
// Order = priority (most specific pattern first) so e.g. "Quads & Glutes"
// correctly matches quads, not glutes. ---
const MUSCLE_VIEWBOX = { front: "0 0 35 93", back: "37 0 35 93" };
const MUSCLE_ZONES = [
  [/rear delt|rotator/i,                      "back",  ["deltoid-rear-left","deltoid-rear-right"], "#e0913d"],
  [/side delt/i,                               "front", ["shoulder-side-left","shoulder-side-right"], "#e0a83d"],
  [/bicep|brachialis/i,                        "front", ["biceps-left","biceps-right"], "#9b6fd1"],
  [/tricep/i,                                  "back",  ["triceps-long-left","triceps-lateral-left","triceps-long-right","triceps-lateral-right"], "#c15fa0"],
  [/chest.{0,20}upper|upper.{0,20}chest/i,     "front", ["chest-upper-left","chest-upper-right"], "#e0665a"],
  [/chest/i,                                   "front", ["chest-lower-left","chest-lower-right"], "#e0665a"],
  [/trap|rhomboid|mid-back/i,                  "back",  ["traps-upper-left","traps-mid-left","traps-lower-left","traps-upper-right","traps-mid-right","traps-lower-right"], "#4a86c0"],
  [/lat/i,                                     "back",  ["lats-upper-left","lats-mid-left","lats-lower-left","lats-upper-right","lats-mid-right","lats-lower-right"], "#3fa39a"],
  [/hamstring/i,                               "back",  ["hamstrings-medial-left","hamstrings-lateral-left","hamstrings-medial-right","hamstrings-lateral-right"], "#7a9e3f"],
  [/quad/i,                                    "front", ["quads-left","quads-right"], "#5a9e5a"],
  [/glute/i,                                   "back",  ["gluteus-medius-left","gluteus-maximus-left","gluteus-medius-right","gluteus-maximus-right"], "#b08050"],
  [/oblique/i,                                 "front", ["obliques-left","obliques-right"], "#c9a23f"],
  [/abs/i,                                     "front", ["abs-upper-left","abs-upper-right","abs-lower-left","abs-lower-right"], "#d1b23f"],
  [/calf|calves/i,                             "back",  ["calves-gastroc-medial-left","calves-gastroc-lateral-left","calves-soleus-left","calves-gastroc-medial-right","calves-gastroc-lateral-right","calves-soleus-right"], "#6b7a8f"],
  [/shoulder|delt/i,                           "front", ["shoulder-front-left","shoulder-front-right"], "#e0a83d"],
];
function muscleZone(label){
  for(const [re,view,ids,color] of MUSCLE_ZONES) if(re.test(label)) return [view, ids, color];
  return ["front", [], "#8a8578"];
}
function shortMuscle(label){ return label.split(" (")[0]; }
function bodySilhouette(view, ids, color){
  const set = new Set(ids);
  const paths = MUSCLE_PATHS[view].map(p =>
    `<path d="${p.d}" fill="${set.has(p.id) ? color : "var(--ink-dim)"}" stroke="var(--ground)" stroke-width="0.2"/>`
  ).join("");
  return `<svg viewBox="${MUSCLE_VIEWBOX[view]}" width="46" height="64">${paths}</svg>`;
}

// --- movement photos: real start/finish frames, sourced from the public-domain
// free-exercise-db (github.com/yuhonas/free-exercise-db), matched by exercise id ---
function moveFrame(dbId, frame, label){
  return `<div class="pose-photo"><img src="${EX_PHOTOS[dbId][frame]}" alt="${label}"></div>`;
}

function loadLog(key){
  try{ return JSON.parse(localStorage.getItem(key) || "null"); }catch(e){ return null; }
}
function saveLog(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

// storage is keyed by the actual calendar date, so past days stay independent
function setKey(date, bi, ei, si, field){
  return `loadout_${date}_${bi}_${ei}_${si}_${field}`;
}

// --- date / weekday helpers ---
const WEEKDAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function isoDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayISO(){ return isoDate(new Date()); }
// dayId is anchored to the chosen week-start weekday: that weekday is always Day 1
function dayIdForDate(dateStr){
  const wd = new Date(dateStr+"T00:00:00").getDay();
  return ((wd - getWeekStartPref() + 7) % 7) + 1;
}
function nearestDateForDayId(dayId){
  const d = new Date();
  for(let i=0;i<7;i++){
    const key = isoDate(d);
    if(dayIdForDate(key) === dayId) return key;
    d.setDate(d.getDate()-1);
  }
  return todayISO();
}
function shiftDate(dateStr, days){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+days);
  return isoDate(d);
}
function getWeekStartPref(){ return Number(localStorage.getItem("loadout_week_start") ?? 6); } // 0=Sun..6=Sat, default Sat
function setWeekStartPref(v){ localStorage.setItem("loadout_week_start", String(v)); }

let viewDate = todayISO();   // date shown on the currently open Dx tab
let calMonth = null;         // {y, m} being browsed on the home calendar; null = current

function getCompletions(){ return loadLog("loadout_completions") || {}; }
function getHistory(){ return loadLog("loadout_history") || {}; }

function buildSnapshot(dayId, date){
  const day = PROGRAM.find(d => d.id === dayId);
  const source = day.repeatOf ? PROGRAM.find(d => d.id === day.repeatOf) : day;
  const entries = [];
  source.blocks.forEach((block, bi) => {
    block.exercises.forEach((ex, ei) => {
      const sets = [];
      for(let si=0; si<ex.maxSets; si++){
        const w = localStorage.getItem(setKey(date,bi,ei,si,"w"));
        const r = localStorage.getItem(setKey(date,bi,ei,si,"r"));
        if(w || r) sets.push({ w: w||"-", r: r||"-" });
      }
      if(sets.length) entries.push({ name: ex.name, muscle: ex.muscle, bi, ei, sets });
    });
  });
  return { dayId, title: day.title, name: day.name, entries };
}

function toggleComplete(dayId, date){
  const c = getCompletions();
  const h = getHistory();
  if(c[date] === dayId){
    delete c[date];
    delete h[date];
  } else {
    c[date] = dayId;
    h[date] = buildSnapshot(dayId, date);
  }
  saveLog("loadout_completions", c);
  saveLog("loadout_history", h);
}

// most recent PAST occurrence of this weekday that has a logged set for (bi,ei)
function lastNumbers(dayId, date, bi, ei){
  const history = getHistory();
  const dates = Object.keys(history).filter(k => k < date && dayIdForDate(k) === dayId).sort();
  for(let i=dates.length-1; i>=0; i--){
    const entry = history[dates[i]].entries.find(e => e.bi===bi && e.ei===ei);
    if(entry) return { date:dates[i], text: entry.sets.map(s=>`${s.w}${tr("kg")}×${s.r}`).join(" · ") };
  }
  return null;
}

function renderExercise(dayId, date, bi, ei, ex){
  const wrap = document.createElement("div");
  wrap.className = "exercise";

  const [zView, zIds, zColor] = muscleZone(ex.muscle);
  const visual = document.createElement("div");
  visual.className = "ex-visual";
  const flowArrow = LANG==="ar" ? "←" : "→";
  visual.innerHTML = `
    <div class="viz-item">${bodySilhouette(zView, zIds, zColor)}<span class="viz-label">${shortMuscle(tx(ex,"muscle"))}</span></div>
    <div class="viz-divider"></div>
    <div class="viz-item">${moveFrame(ex.photo, 0, ex.name+" start")}<span class="viz-label">${tr("start")}</span></div>
    <span class="viz-arrow">${flowArrow}</span>
    <div class="viz-item">${moveFrame(ex.photo, 1, ex.name+" finish")}<span class="viz-label">${tr("finish")}</span></div>
  `;
  wrap.appendChild(visual);

  const top = document.createElement("div");
  top.className = "ex-top";
  const setsTxt = ex.minSets===ex.maxSets ? String(ex.minSets) : ex.minSets+"–"+ex.maxSets;
  const repsTxt = ex.minReps+"–"+ex.maxReps;
  top.innerHTML = `
    <div class="ex-text">
      <div class="ex-name">${tx(ex,"name")}</div>
      <div class="ex-muscle">${tx(ex,"muscle")}</div>
    </div>
    <div class="ex-range">${tr("sets_reps",{sets:`<b>${setsTxt}</b>`, reps:`<b>${repsTxt}</b>`})}</div>
  `;
  top.addEventListener("click", () => wrap.classList.toggle("open"));
  wrap.appendChild(top);

  const cue = document.createElement("div");
  cue.className = "cue";
  cue.textContent = tx(ex,"cue");
  wrap.appendChild(cue);

  const setsWrap = document.createElement("div");
  setsWrap.className = "sets";
  for(let si=0; si<ex.maxSets; si++){
    const row = document.createElement("div");
    row.className = "set-row";

    const num = document.createElement("div");
    num.className = "set-num";
    num.textContent = si+1;

    const wInput = document.createElement("input");
    wInput.type = "text"; wInput.inputMode = "decimal"; wInput.placeholder = tr("kg");
    const rInput = document.createElement("input");
    rInput.type = "text"; rInput.inputMode = "numeric"; rInput.placeholder = tr("reps_placeholder");

    const wK = setKey(date,bi,ei,si,"w"), rK = setKey(date,bi,ei,si,"r"), dK = setKey(date,bi,ei,si,"done");
    wInput.value = localStorage.getItem(wK) || "";
    rInput.value = localStorage.getItem(rK) || "";
    wInput.addEventListener("input", () => localStorage.setItem(wK, wInput.value));
    rInput.addEventListener("input", () => localStorage.setItem(rK, rInput.value));

    const check = document.createElement("button");
    check.className = "set-check";
    check.textContent = "✓";
    check.type = "button";
    const isDone = localStorage.getItem(dK) === "1";
    if(isDone) check.classList.add("done");
    check.addEventListener("click", () => {
      const now = !check.classList.contains("done");
      check.classList.toggle("done", now);
      localStorage.setItem(dK, now ? "1" : "0");
    });

    row.appendChild(num); row.appendChild(wInput); row.appendChild(rInput); row.appendChild(check);
    setsWrap.appendChild(row);
  }
  wrap.appendChild(setsWrap);

  const last = lastNumbers(dayId, date, bi, ei);
  if(last){
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = tr("last_time", {date: formatShort(last.date), text: last.text});
    wrap.appendChild(hint);
  }

  return wrap;
}

function renderBlock(dayId, date, bi, block){
  const card = document.createElement("div");
  card.className = "block";
  const head = document.createElement("div");
  head.className = "block-head";
  head.innerHTML = `<span class="chip" style="background:var(${PLATE_VAR[block.plate]})"></span>
    <h3>${block.label}</h3><span class="block-type">${block.type}</span>`;
  card.appendChild(head);
  block.exercises.forEach((ex, ei) => card.appendChild(renderExercise(dayId, date, bi, ei, ex)));
  return card;
}

function formatShort(dateStr){
  return new Date(dateStr+"T00:00:00").toLocaleDateString(localeArg(),{weekday:"short", month:"short", day:"numeric"});
}
function formatLong(dateStr){
  return new Date(dateStr+"T00:00:00").toLocaleDateString(localeArg(),{weekday:"long", month:"short", day:"numeric"});
}

function renderDay(dayId, date){
  viewDate = date;
  const day = PROGRAM.find(d => d.id === dayId);
  const main = document.getElementById("main");
  main.innerHTML = "";

  const isToday = date === todayISO();
  const nav = document.createElement("div");
  nav.className = "date-nav";
  const prevGlyph = LANG==="ar" ? "›" : "‹";
  const nextGlyph = LANG==="ar" ? "‹" : "›";
  nav.innerHTML = `
    <button class="date-arrow" id="date-prev" aria-label="${tr("prev_week")}">${prevGlyph}</button>
    <div class="date-current${isToday?" is-today":""}">${formatLong(date)}${isToday?" · "+tr("today_btn"):""}</div>
    <button class="date-arrow" id="date-next" aria-label="${tr("next_week")}">${nextGlyph}</button>
  `;
  main.appendChild(nav);
  nav.querySelector("#date-prev").addEventListener("click", () => selectDate(shiftDate(date,-7)));
  nav.querySelector("#date-next").addEventListener("click", () => selectDate(shiftDate(date,7)));

  if(day.rest){
    main.innerHTML += `
      <div class="rest">
        <h2>${tr("full_recovery")}</h2>
        <p>${tr("rest_body")}</p>
      </div>`;
    return;
  }

  const source = day.repeatOf ? PROGRAM.find(d => d.id === day.repeatOf) : day;

  const head = document.createElement("div");
  head.className = "day-head";
  head.innerHTML = `<h2>${day.title}: ${tDayName(day.name)}</h2>`;
  main.appendChild(head);

  if(day.repeatOf){
    const note = document.createElement("div");
    note.className = "repeat-note";
    note.innerHTML = `<span>🔁</span><span>${tr("repeat_note",{n:day.repeatOf})}</span>`;
    main.appendChild(note);
  }

  source.blocks.forEach((block, bi) => main.appendChild(renderBlock(dayId, date, bi, block)));
  main.appendChild(renderCompleteButton(dayId, date));
}

function renderCompleteButton(dayId, date){
  const c = getCompletions();
  const done = c[date] === dayId;
  const btn = document.createElement("button");
  btn.className = "complete-btn" + (done ? " done" : "");
  btn.textContent = done ? tr("completed") : tr("mark_complete");
  btn.addEventListener("click", () => { toggleComplete(dayId, date); renderDay(dayId, date); });
  return btn;
}

function monthMeta(y, m){
  const first = new Date(y, m, 1);
  const startPref = getWeekStartPref();
  const startOffset = (first.getDay() - startPref + 7) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  return { startOffset, daysInMonth };
}

function renderCalendar(){
  if(!calMonth) calMonth = { y: new Date().getFullYear(), m: new Date().getMonth() };
  const { y, m } = calMonth;
  const { startOffset, daysInMonth } = monthMeta(y, m);
  const completions = getCompletions();
  const todayKey = todayISO();
  const startPref = getWeekStartPref();

  let cells = "";
  for(let i=0; i<startOffset; i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const isToday = key === todayKey;
    const done = completions[key];
    cells += `<div class="cal-cell${isToday?" today":""}${done?" done":""}" data-date="${key}"><span class="cal-num">${d}</span></div>`;
  }

  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - ((now.getDay()-startPref+7)%7));
  let weekDone = 0, weekTarget = 0;
  for(let i=0;i<7;i++){
    const dt = new Date(weekStart); dt.setDate(weekStart.getDate()+i);
    const key = isoDate(dt);
    if(dayIdForDate(key) !== 7) weekTarget++;
    if(completions[key]) weekDone++;
  }

  const todayDayId = dayIdForDate(todayKey);
  const todayProgram = PROGRAM.find(d => d.id === todayDayId);
  const dowLabels = Array.from({length:7}, (_,i) => WEEKDAY_NAMES[(startPref+i)%7][0]);
  const weekStartOptions = WEEKDAY_NAMES.map((n,i) => `<option value="${i}"${i===startPref?" selected":""}>${n}</option>`).join("");

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="day-head"><h2>${tr("calendar_heading")}</h2></div>
    <div class="cal-card">
      <div class="cal-toolbar">
        <button class="cal-nav" id="cal-prev" aria-label="${tr("prev_month")}">${LANG==="ar"?"›":"‹"}</button>
        <div class="cal-month">${new Date(y,m,1).toLocaleString(localeArg(),{month:"long", year:"numeric"})}</div>
        <button class="cal-nav" id="cal-next" aria-label="${tr("next_month")}">${LANG==="ar"?"‹":"›"}</button>
      </div>
      <div class="cal-grid cal-dow">${dowLabels.map(l=>`<div>${l}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-footer">
        <label class="week-start-picker">${tr("week_starts")}
          <select id="week-start-select">${weekStartOptions}</select>
        </label>
        <label class="week-start-picker">${tr("language")}
          <select id="lang-select">
            <option value="en"${LANG==="en"?" selected":""}>English</option>
            <option value="ar"${LANG==="ar"?" selected":""}>العربية</option>
          </select>
        </label>
        <button class="cal-today-btn" id="cal-today">${tr("today_btn")}</button>
      </div>
    </div>
    <div id="cal-detail"></div>
    <div class="week-stat">
      <div>${tr("week_stat",{done:`<b>${weekDone}</b>`, target:weekTarget})}</div>
    </div>
    <div class="today-card">
      <div class="today-label">${tr("today_btn")} · ${todayProgram.title}</div>
      <div class="today-name">${tDayName(todayProgram.name)}</div>
      <button class="start-btn" id="start-today">${todayProgram.rest ? tr("view_rest_day") : tr("start_workout")}</button>
    </div>
  `;
  wrap.querySelector("#start-today").addEventListener("click", () => selectDate(todayKey));
  wrap.querySelector("#cal-today").addEventListener("click", () => { calMonth = null; selectDay("home"); });
  wrap.querySelector("#cal-prev").addEventListener("click", () => { calMonth = { y: m===0?y-1:y, m: m===0?11:m-1 }; selectDay("home"); });
  wrap.querySelector("#cal-next").addEventListener("click", () => { calMonth = { y: m===11?y+1:y, m: m===11?0:m+1 }; selectDay("home"); });
  wrap.querySelector("#week-start-select").addEventListener("change", (e) => { setWeekStartPref(Number(e.target.value)); selectDay("home"); });
  wrap.querySelector("#lang-select").addEventListener("change", (e) => { setLang(e.target.value); renderTabs(); selectDay("home"); });

  const history = getHistory();
  const detail = wrap.querySelector("#cal-detail");
  wrap.querySelectorAll(".cal-cell:not(.empty)").forEach(cell => {
    cell.addEventListener("click", () => {
      const key = cell.dataset.date;
      const already = detail.dataset.date === key;
      wrap.querySelectorAll(".cal-cell").forEach(c => c.classList.remove("selected"));
      if(already){ detail.innerHTML = ""; detail.dataset.date = ""; return; }
      cell.classList.add("selected");
      detail.dataset.date = key;
      const snap = history[key];
      const dateLabel = formatLong(key);
      const dayId = dayIdForDate(key);
      const dayName = PROGRAM.find(d => d.id === dayId).name;
      if(!snap || !snap.entries.length){
        detail.innerHTML = `<div class="detail-card">
          <div class="detail-date">${dateLabel} · ${tDayName(dayName)}</div>
          <p class="detail-empty">${tr("nothing_logged")}</p>
          <button class="detail-log-btn">${tr("log_day")}</button>
        </div>`;
      } else {
        detail.innerHTML = `<div class="detail-card">
          <div class="detail-date">${dateLabel} · ${snap.title}: ${tDayName(snap.name)}</div>
          ${snap.entries.map(e => `
            <div class="detail-ex">
              <div class="detail-ex-name">${txName(e.name)}</div>
              <div class="detail-sets">${e.sets.map(s => `<span class="detail-chip">${s.w}${tr("kg")}×${s.r}</span>`).join("")}</div>
            </div>
          `).join("")}
          <button class="detail-log-btn">${tr("edit_day")}</button>
        </div>`;
      }
      detail.querySelector(".detail-log-btn").addEventListener("click", () => selectDate(key));
    });
  });
  return wrap;
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  const activeId = tabs.querySelector(".tab.active")?.dataset.id;
  tabs.innerHTML = "";
  const homeTab = document.createElement("button");
  homeTab.className = "tab home-tab";
  homeTab.textContent = "🏠";
  homeTab.dataset.id = "home";
  homeTab.addEventListener("click", () => selectDay("home"));
  tabs.appendChild(homeTab);

  const todayDayId = dayIdForDate(todayISO());
  PROGRAM.forEach(day => {
    const t = document.createElement("button");
    t.className = "tab";
    t.innerHTML = day.title.replace("Day ", "D") + (day.id===todayDayId ? '<span class="tab-today-dot"></span>' : "");
    t.addEventListener("click", () => selectDay(day.id));
    t.dataset.id = day.id;
    if(activeId !== undefined) t.classList.toggle("active", String(t.dataset.id) === String(activeId));
    tabs.appendChild(t);
  });

  document.getElementById("today-btn").textContent = tr("today_pill");
  document.getElementById("footer-text").innerHTML = tr("footer");
}

function init(){
  applyDir();
  renderTabs();
  document.getElementById("today-btn").addEventListener("click", () => selectDate(todayISO()));
  selectDay("home");
}

function selectDay(id){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", String(t.dataset.id) === String(id)));
  if(id === "home"){
    const main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(renderCalendar());
    return;
  }
  renderDay(id, nearestDateForDayId(id));
}

// jump directly to a specific calendar date (used by calendar taps and the Today button)
function selectDate(date){
  const dayId = dayIdForDate(date);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", String(t.dataset.id) === String(dayId)));
  renderDay(dayId, date);
}

document.addEventListener("click", (e) => {
  const photo = e.target.closest(".pose-photo");
  if(!photo) return;
  const img = photo.querySelector("img");
  const box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = `<img src="${img.src}" alt="${img.alt}"><div class="lightbox-caption">${img.alt}</div>`;
  box.addEventListener("click", () => box.remove());
  document.body.appendChild(box);
});

init();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
